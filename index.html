<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form-skeleton</title>
  </head>
  <body>
    <form id="signup-form">
      <h1>สมัครสมาชิก</h1>

      <label for="full-name">ชื่อ-นามสกุล</label>
      <input
        id="full-name"
        name="fullName"
        type="text"
        placeholder="--กรอกข้อมูล--"
      />

      <label for="email">อีเมล</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="--กรอกข้อมูล--"
      />

      <button type="submit">ส่งข้อมูล</button>
    </form>
    <br />

  </body>
</html>
