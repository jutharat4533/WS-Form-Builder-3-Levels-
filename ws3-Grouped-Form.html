<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grouped-Form</title>
  </head>
  <body>
    <h1>ฟอร์มสมัครเข้าร่วมเวิร์กช็อป</h1>
    <form action=""></form>
    <fieldset>
      <legend>ข้อมูลผู้สมัคร</legend>
      <label for="name">ชื่อ-นามสกุล</label>
      <input id="name" name="name" type="text" />
      <label for="experience">ประสบการณ์</label>
      <select name="experience" id="experience">
        <option value="">เลือกระดับ</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advance">Advance</option>
      </select>
    </fieldset>
    <br />
    <fieldset>
      <legend>ข้อมูลผู้ติดต่อ</legend>
      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" />
      <label for="phone">เบอร์โทร</label>
      <input type="tel" id="phone" name="phone" />
    </fieldset>
    <br />
    <fieldset>
      <legend>ความต้องการเพิ่มเติม</legend>
      <label for="goal">เป้าหมายของคุณ</label>
      <textarea name="goal" id="goal"></textarea>
    </fieldset>
    <br />
    <button type="submit">ส่งใบสมัคร</button>
  </body>
</html>
